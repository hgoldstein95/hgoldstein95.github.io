# Content for the SCAUP Lab sub-site at /scaup/.
#
# Nothing here is read by the main site. The sub-site has its own shell
# (templates/scaup/) and its own stylesheet (sass/scaup.scss); see the "SCAUP Lab
# sub-site" section of CLAUDE.md before editing either.
#
# Top-level scalars must stay above the first [table] or [[array]] below, or TOML
# reads them as part of it.

name = "SCAUP Lab"
# Sits opposite the way back to the main site in the header.
eyebrow = "University at Buffalo · CSE"
# The expansion under the wordmark. Rendered as markdown, so the bolded letters
# are the acronym: S-C-A-U-P.
acronym = "**S**oftware **C**orrectness **A**nd **U**ser-oriented **P**rogramming"

# The lede paragraphs beside the illustration are the body of
# content/scaup/_index.md, not data.

# ---------------------------------------------------------------- people
#
# One card each, in the order given. `photo` is optional — a person without one
# gets the empty tinted block the card is sized for, which is what the design
# does for an unfilled slot. Photos want a 4:5 crop; they are object-fit: cover.
# `url` and `note` are both optional.

[[people]]
name = "Harry Goldstein"
role = "Assistant Professor"
url = "/"
link_label = "site"
photo = "/img/profile.jpeg"

[[people]]
name = "Cassia Torczon"
role = "PhD Student"
note = "co-advised with Benjamin C. Pierce at UPenn"
url = "https://cassiatorczon.github.io"
link_label = "site"
photo = "/img/cassia.jpg"

[[people]]
name = "Julia Montuori-Ahuja"
role = "PhD Student"

[[people]]
name = "Francille Zhuang"
role = "PhD Student"

# ---------------------------------------------------------------- connections
#
# The cards under the "Connections" heading. The key is still `homes` — the
# section was called "Wider homes" in the design it was ported from.
#
# `host` is the short text under the arrow, not the URL — write it the way you
# want it read. The grid is auto-fill, so a short list keeps its column widths
# instead of stretching; add more entries as they become real.

[[homes]]
title = "UB Computer Science and Engineering"
blurb = "Our department."
url = "https://engineering.buffalo.edu/computer-science-engineering.html"
host = "buffalo.edu"

[[homes]]
title = "UB Databases and Programming Languages"
blurb = "Our members are all members of the DBPL group."
url = "https://cse.buffalo.edu/dbpl/"
host = "cse.buffalo.edu/dbpl"

# ---------------------------------------------------------------- contact

[contact]
heading = "Get in Touch"
lines = [
  "Department of Computer Science and Engineering",
  "University at Buffalo, Buffalo, NY",
]
email = "hgoldste@buffalo.edu"
