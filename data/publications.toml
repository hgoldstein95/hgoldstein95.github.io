# One flat, year-sorted list. `venue_short` is the filter key on /publications,
# `topic` preserves the old section grouping, and `selected = true` puts a paper
# on the home page.
#
# `major = true` marks refereed conference and journal papers. Those render in
# the main list on /publications and are the only ones the venue filter covers;
# everything else (workshops, experience reports, demos, posters, essays) falls
# into the "Workshops, Demos & Other" section below it. Every paper carries the
# flag explicitly so a new entry that forgets it is obvious.
#
# Chip order on /publications. Every `venue_short` used by a `major` paper must
# appear here; non-major venues are deliberately absent.
venues = ["PLDI", "OOPSLA", "ICFP", "ICSE", "UIST", "CCS", "ESOP", "JFP"]

