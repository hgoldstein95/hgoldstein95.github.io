{% extends "base.html" %}

{% block content %}
  <article class="section" itemscope itemtype="https://schema.org/BlogPosting">
    <div class="section-head">
      <h1 itemprop="name headline">{{ page.title }}</h1>
      <a class="section-more" href="/blog/">All posts &rarr;</a>
    </div>
    <p class="post-meta">
      <time datetime="{{ page.date | date(format="%Y-%m-%dT%H:%M:%S+00:00") }}" itemprop="datePublished">
        {{ page.date | date(format="%b %-d, %Y") }}
      </time>
    </p>

    <div class="prose prose--measure" itemprop="articleBody">
      {{ page.content | safe }}
    </div>

    {% if page.extra.math %}
      <script>
        window.MathJax = {
          tex: {
            inlineMath: [["$", "$"]],
            displayMath: [["$$", "$$"]],
            processEscapes: true
          },
          options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] }
        };
      </script>
      <script id="MathJax-script" async
              src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
    {% endif %}
  </article>
{% endblock content %}
