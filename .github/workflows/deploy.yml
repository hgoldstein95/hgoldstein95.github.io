name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compiled in the official TeX Live image (Island of TeX, scheme-full --
      # resume.tex needs firasans and montserrat from collection-fontsextra).
      # `latest` currently tracks TL2026; pin to TL2026-historic to freeze it.
      - name: Build resume PDF
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work/resume \
            texlive/texlive:latest \
            latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode resume.tex
      - name: Publish resume PDF into the site
        run: cp resume/resume.pdf static/resume.pdf
      # Installed from the release tarball rather than a third-party action.
      # ubuntu-latest is x86_64; ZOLA_SHA256 is the sha256 of that asset and
      # must be updated whenever ZOLA_VERSION is.
      - name: Install Zola
        shell: bash
        env:
          ZOLA_VERSION: "0.23.3"
          ZOLA_SHA256: "f07c92607e5745268b576bd325ceef3a582aada253bb64db8d92a8a85303d958"
        run: |
          url="https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "$url" -o "$RUNNER_TEMP/zola.tar.gz"
          echo "${ZOLA_SHA256}  ${RUNNER_TEMP}/zola.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zola-bin"
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP/zola-bin" zola
          "$RUNNER_TEMP/zola-bin/zola" --version
          echo "$RUNNER_TEMP/zola-bin" >> "$GITHUB_PATH"
      - run: zola build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
