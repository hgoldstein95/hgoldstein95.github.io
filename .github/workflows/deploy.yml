name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compiled in the official TeX Live image (Island of TeX, scheme-full --
      # resume.tex needs firasans and montserrat from collection-fontsextra).
      # `latest` currently tracks TL2026; pin to TL2026-historic to freeze it.
      - name: Build resume PDF
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work/resume \
            texlive/texlive:latest \
            latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode resume.tex
      - name: Publish resume PDF into the site
        run: cp resume/resume.pdf static/resume.pdf
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.3
      - run: zola build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
