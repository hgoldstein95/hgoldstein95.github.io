base_url = "https://harrisongoldste.in"
title = "Harrison Goldstein"
description = "Harrison Goldstein is an Assistant Professor of Computer Science and Engineering at the University at Buffalo, working on property-based testing, formal methods, and usable software validation tools."
author = "Harrison Goldstein"
compile_sass = true
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]

[markdown.highlighting]
theme = "github-light"
style = "class"

[extra]
author = "Harrison Goldstein"
twitter_username = "hgoldstein95"
github_username = "hgoldstein95"
# Full-resolution headshot, linked from /press/ and used as the social card image.
profile_picture = "/img/profile.jpeg"
# Masthead portrait only: 252px, a 3x source for the 84px slot (44px on mobile),
# same aspect ratio as the original so the CSS cover/position framing is unchanged.
# Keep it small — base.html preloads it to beat first paint, and an image much
# heavier than style.css loses that race. Regenerate with:
#   sips -Z 252 --setProperty formatOptions 78 static/img/profile.jpeg \
#     --out static/img/profile-thumb.jpg
profile_thumbnail = "/img/profile-thumb.jpg"
footer = true
footer_url = "https://github.com/hgoldstein95/hgoldstein95.github.io"
footer_text = "Website source on GitHub"
# Navigation now lives in data/directory.toml (the "I'm looking for..." block)
# and data/rail.toml (the "Also here" links), so there is no extra.nav here.
